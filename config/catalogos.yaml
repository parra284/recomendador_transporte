# Catálogos de valores válidos para las solicitudes.
# Fuente única: datos de ejemplo, validaciones y dashboard deben leer de aquí.

origenes:
  - BUN-SPRBUN    # Buenaventura - Sociedad Portuaria Regional
  - BUN-TCBUEN    # Buenaventura - TCBUEN
  - CTG-CONTECAR  # Cartagena - Contecar
  - CTG-SPRC      # Cartagena - Sociedad Portuaria Regional
  - BAQ-SPRB      # Barranquilla - Sociedad Portuaria Regional

destinos:
  - BOG  # Bogotá
  - MDE  # Medellín
  - CLO  # Cali
  - BGA  # Bucaramanga
  - PEI  # Pereira
  - BAQ  # Barranquilla

tipos_contenedor:
  - 20DV  # seco 20'
  - 40DV  # seco 40'
  - 40HC  # seco 40' high cube
  - 20RF  # refrigerado 20'
  - 40RF  # refrigerado 40'
  - 40FR  # flat rack 40'
  - 40OT  # open top 40'

# Vacío (sin valor) también es válido.
modalidades_aduaneras:
  - NACIONALIZADA
  - DTA
  - ZONA_FRANCA

prioridades:
  - normal
  - urgente
  - economica
  - alto_valor

clases_imo: [1, 2, 3, 4, 5, 6, 7, 8, 9]

# Formato de fecha_cita (ISO 8601 sin segundos).
formato_fecha_cita: "%Y-%m-%dT%H:%M"

# Peso bruto máximo por tipo de contenedor (toneladas, MGW estándar ISO).
peso_max_t:
  20DV: 30.48
  40DV: 30.48
  40HC: 30.48
  20RF: 30.48
  40RF: 30.48
  40FR: 45.00
  40OT: 30.48
